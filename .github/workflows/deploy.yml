name: Deploy Blog Post

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

permissions:
  contents: read
  id-token: write # This is required for requesting the JWT
  issues: write
  pull-requests: write

jobs:
  build-and-deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Get latest Node.js version from CI
        uses: actions/github-script@v6
        id: get-node-version
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
             try {
              const workflow = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci.yml',
                status: 'success',
                per_page: 1
              })
              if (workflow.data.workflow_runs.length === 0) {
                throw new Error('No successful CI workflow runs found')
              }
              const workflowRun = workflow.data.workflow_runs[0]
              const jobs = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: workflowRun.id
              })
              const determineLatestNodeJob = jobs.data.jobs.find(job => job.name === 'determine-latest-node')
              if (!determineLatestNodeJob) {
                throw new Error('Could not find determine-latest-node job')
              }
              const setLatestNodeStep = determineLatestNodeJob.steps.find(step => step.name === 'Set latest Node.js version')
              if (!setLatestNodeStep || !setLatestNodeStep.outputs || !setLatestNodeStep.outputs.latest_node) {
                throw new Error('Could not find latest_node output in Set latest Node.js version step')
              }
              return setLatestNodeStep.outputs.latest_node
            } catch (error) {
              core.warning(`Failed to get latest Node.js version: ${error.message}`)
              core.warning('Falling back to default Node.js version')
              return '18.17.1' // Fallback to the latest version in your CI matrix
            }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.get-node-version.outputs.result }}
          cache: 'pnpm'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::510046314388:role/github.to.aws.oicd
          aws-region: us-east-1

      - name: Install modules
        run: pnpm install

      - name: Build application
        run: pnpm build

      - name: Deploy to S3
        run: aws s3 sync --delete ./dist/ s3://${{ secrets.BUCKET_ID }}

      - name: Create CloudFront invalidation
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.DISTRIBUTION_ID }} --paths "/*"

  dast:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
    - name: ZAP Scan
      uses: zaproxy/action-full-scan@v0.10.0
      with:
        target: 'https://www.devsec-cooper.codes/'

    - name: Create Issue from ZAP Report
      if: failure()
      uses: actions/github-script@v6
      with:
        github-token: ${{secrets.GITHUB_TOKEN}}
        script: |
          const fs = require('fs')
          try {
            const zapReport = JSON.parse(fs.readFileSync('zap-full-scan-results.json', 'utf8'))
            const highAlerts = zapReport.site[0].alerts.filter(alert => alert.riskcode === "3")
            if (highAlerts.length > 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'High Risk Vulnerabilities Detected',
                body: `ZAP scan detected ${highAlerts.length} high risk vulnerabilities. Please review the full scan results.`
              })
            }
          } catch (error) {
            core.setFailed(`Failed to process ZAP report: ${error.message}`)
          }
